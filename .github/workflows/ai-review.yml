name: AI Code Review

on:
  push:

permissions:
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit diff
        run: |
          git diff HEAD^ HEAD > commit.diff

      - name: Run Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open("commit.diff", "r", encoding="utf-8") as f:
              diff = f.read()

          if not diff.strip():
              review = "No code changes found to review."
          else:
              prompt = f"""
          You are an experienced software engineer reviewing a code commit.

          Review ONLY the changes in the diff below.

          Look for:
          - Bugs
          - Security vulnerabilities
          - Incorrect logic
          - Error handling problems
          - Performance problems
          - Breaking changes
          - Serious maintainability problems

          Ignore minor formatting and style issues.

          Do not invent problems.

          If you find an issue, explain:
          - Severity
          - File/location
          - Problem
          - Why it matters
          - Suggested fix

          If there are no significant problems, say:
          "No significant issues found."

          DIFF:
          {diff}
          """

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  "models/gemini-2.5-flash-lite:generateContent"
                  f"?key={os.environ['GEMINI_API_KEY']}"
              )

              data = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ]
              }

              request = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read().decode("utf-8"))

              review = result["candidates"][0]["content"]["parts"][0]["text"]

          print("\n===== GEMINI AI CODE REVIEW =====\n")
          print(review)
          print("\n===== END REVIEW =====\n")
          PY
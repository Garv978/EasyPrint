name: AI Code Review

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ai-review:
    # Don't run when Dependabot pushes dependency updates
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit diff
        run: |
          git diff HEAD^ HEAD > commit.diff

      - name: Run Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("commit.diff", "r", encoding="utf-8") as f:
              diff = f.read()

          if not diff.strip():
              print("No code changes found to review.")
              exit(0)

          prompt = f"""
          You are an experienced software engineer reviewing a code commit.

          Review ONLY the changes in the diff below.

          Look for:
          - Bugs
          - Security vulnerabilities
          - Incorrect logic
          - Error handling problems
          - Performance problems
          - Breaking changes
          - Serious maintainability problems

          Ignore:
          - Formatting
          - Minor style preferences
          - Minor naming preferences

          Do not invent problems.

          For every real issue you find, provide:

          1. Severity: Critical / High / Medium / Low
          2. File and approximate location
          3. What is wrong
          4. Why it matters
          5. Suggested fix

          If there are no significant problems, say:

          "No significant issues found."

          Here is the commit diff:

          {diff}
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.5-flash-lite:generateContent"
          )

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              print("Gemini API request failed.")
              print("HTTP status:", e.code)
              print("Response:")
              print(e.read().decode("utf-8"))
              raise

          review = result["candidates"][0]["content"]["parts"][0]["text"]

          print()
          print("===== GEMINI AI CODE REVIEW =====")
          print()
          print(review)
          print()
          print("===== END REVIEW =====")
          PY